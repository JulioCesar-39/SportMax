<div class="conta-page">

  <div class="conta-card">
    <div class="conta-header">
      <h2>Meus Dados</h2>
      <button class="btn-sair" (click)="sair()">Sair da Conta</button>
    </div>

    <form (ngSubmit)="salvarAlteracoes()">
      
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" [(ngModel)]="cliente.nome">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="cpf">CPF (Não alterável)</label>
          <input type="text" id="cpf" name="cpf" [(ngModel)]="cliente.cpf" disabled class="input-bloqueado">
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" [(ngModel)]="cliente.telefone">
        </div>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" [(ngModel)]="cliente.email">
      </div>

      <div class="form-group">
        <label for="endereco">Endereço Completo</label>
        <input type="text" id="endereco" name="endereco" [(ngModel)]="cliente.endereco">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="text" id="senha" name="senha" [(ngModel)]="cliente.senha">
      </div>

      @if (mensagemSucesso) {
        <p class="conta-sucesso">{{ mensagemSucesso }}</p>
      }

      <div class="acoes-container">
        <button type="submit" class="btn-salvar">SALVAR ALTERAÇÕES</button>
      </div>

    </form>

    <div class="zona-perigo">
      <h3>Zona de Perigo</h3>
      <p>Ao encerrar a sua conta, perderá o acesso ao histórico de pedidos da SportMax.</p>
      <button type="button" class="btn-excluir" (click)="excluirConta()">Encerrar Minha Conta</button>
    </div>

  </div>

</div>
