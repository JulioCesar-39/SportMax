<div class="login-page">

  <div class="login-header">

    <h1>Acesse sua conta</h1>

    <p>
      Entre em sua conta para continuar na SportMax.
    </p>

  </div>


  <div class="login-card">

    <h2>Login</h2>

    <p class="login-welcome">
      Bem-vindo de volta!
    </p>


    <form (ngSubmit)="entrar()">

      <div class="form-group">

        <label for="email">
          E-mail ou CPF
        </label>

        <input type="text" id="email" name="email" placeholder="Digite seu e-mail ou CPF" [(ngModel)]="emailOuCpf">

      </div>


      <div class="form-group">

        <label for="senha">
          Senha
        </label>

        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" [(ngModel)]="senha">

      </div>


      <div class="login-options">

        <label class="remember">

          <input type="checkbox" name="lembrar">

          <span>Lembrar de mim</span>

        </label>


        <a href="#">
          Esqueceu sua senha?
        </a>

      </div>


      @if (mensagemErro) {
      <p class="login-error">
        {{ mensagemErro }}
      </p>
      }

      <button type="submit">
        ENTRAR
      </button>

      <div class="cadastro-link">
        <p>Não tem uma conta? <a routerLink="/cadastro">Cadastre-se</a></p>
      </div>

    </form>

  </div>

</div>
