<div class="pagina">
  <main class="conteudo-principal">
    <div class="container">

      <div class="header-manutencao">
        <h1 class="titulo-pagina">Manutenção de Produtos</h1>
        <span class="badge-perfil">Perfil: Admin</span>
      </div>

      <!-- FORMULÁRIO (INCLUSÃO / ALTERAÇÃO) -->
      <section class="card-manutencao">
        <h2 class="subtitulo-secao">Cadastrar / Alterar Produto</h2>

        <form class="form-produto">
          <div class="grid-form">
            <div class="campo-form">
              <label for="nome">Nome do Produto</label>
              <input type="text" id="nome" name="nome" placeholder="Ex: Jaqueta Puffer Bobojaco"
                [(ngModel)]="produto.nome">
            </div>

            <div class="campo-form">
              <label for="categoria">Categoria</label>
              <select id="categoria" name="categoria" [(ngModel)]="produto.categoria">
                <option value="">Selecione a categoria...</option>
                <option value="Roupas">Roupas</option>
                <option value="Tênis">Tênis</option>
                <option value="Acessórios">Acessórios</option>
              </select>
            </div>

            <div class="campo-form">
              <label for="preco">Preço (R$)</label>
              <input type="number" step="0.01" id="preco" name="preco" placeholder="159.99"
                [(ngModel)]="produto.preco">
            </div>

            <div class="campo-form">
              <label for="estoque">Estoque (Qtd)</label>
              <input type="number" id="estoque" name="estoque" placeholder="10"
                [(ngModel)]="produto.estoque">
            </div>

            <div class="campo-form campo-full">
              <label for="imagem">Caminho da Imagem</label>
              <input type="text" id="imagem" name="imagem" placeholder="/imagens/puffer.png"
                [(ngModel)]="produto.imagem">
            </div>

            <div class="campo-form campo-full">
              <label for="destaque">
                <input type="checkbox" id="destaque" name="destaque" [(ngModel)]="produto.destaque">
                Exibir em destaque na página inicial
              </label>
            </div>
          </div>

          <div class="acoes-form">
            <button type="button" class="btn-secundario" (click)="limpar()">Limpar</button>
            <button type="button" class="btn-salvar" (click)="salvar()">Salvar Produto</button>
          </div>
        </form>
      </section>

      <!-- TABELA (CONSULTA / ALTERAÇÃO / EXCLUSÃO) -->
      <section class="card-manutencao">
        <h2 class="subtitulo-secao">Lista de Produtos Cadastrados</h2>

        <div class="tabela-responsive">
          <table class="tabela-produtos">
            <thead>
              <tr>
                <th>ID</th>
                <th>Imagem</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody>
              @for (item of listaProdutos; track item.id) {
                <tr>
                  <td>#{{ item.id }}</td>
                  <td><img [src]="item.imagem" [alt]="item.nome" class="img-thumb"></td>
                  <td class="nome-tabela">{{ item.nome }}</td>
                  <td>{{ item.categoria }}</td>
                  <td class="preco-tabela">R$ {{ item.preco.toFixed(2) }}</td>
                  <td>{{ item.estoque }}</td>
                  <td>
                    <div class="acoes-tabela">
                      <button type="button" class="btn-acao btn-alterar" (click)="editar(item.id)">Alterar</button>
                      <button type="button" class="btn-acao btn-excluir" (click)="excluir(item.id)">Excluir</button>
                    </div>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </main>
</div>
