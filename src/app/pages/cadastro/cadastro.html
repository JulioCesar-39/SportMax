<div class="cadastro-page">

  <div class="cadastro-header">
    <h1>Crie sua conta</h1>
    <p>Junte-se à SportMax e aproveite ofertas exclusivas.</p>
  </div>

  <div class="cadastro-card">
    <h2>Dados Pessoais</h2>

    <form (ngSubmit)="cadastrar()">
      
      <div class="form-group">
        <label for="nome">Nome Completo *</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" [(ngModel)]="cliente.nome">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" [(ngModel)]="cliente.cpf">
        </div>

        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" [(ngModel)]="cliente.telefone">
        </div>
      </div>

      <div class="form-group">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" placeholder="Digite seu melhor e-mail" [(ngModel)]="cliente.email">
      </div>

      <div class="form-group">
        <label for="endereco">Endereço Completo</label>
        <input type="text" id="endereco" name="endereco" placeholder="Rua, Número, Bairro, Cidade - UF" [(ngModel)]="cliente.endereco">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="senha">Senha *</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" [(ngModel)]="cliente.senha">
        </div>

        <div class="form-group">
          <label for="confirmarSenha">Confirmar Senha *</label>
          <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" [(ngModel)]="cliente.confirmarSenha">
        </div>
      </div>

      @if (mensagemErro) {
        <p class="cadastro-error">
          {{ mensagemErro }}
        </p>
      }

      <button type="submit" class="btn-cadastrar">
        CRIAR CONTA
      </button>

      <div class="cadastro-options">
        <p>Já possui uma conta? <a routerLink="/login">Entrar</a></p>
      </div>

    </form>
  </div>

</div>
