<div class="pagina">
  <main class="conteudo-principal">
    <div class="container">

      @for (categoria of categorias; track categoria) {
        <section class="categoria-secao">
          <h2 class="titulo-categoria">{{ categoria }}</h2>

          <div class="grid-produtos">
            @for (produto of listaProdutos; track produto.id) {
              @if (produto.categoria === categoria) {
                <article class="card-produto">
                  <img [src]="produto.imagem" [alt]="produto.nome">
                  <p class="nome-produto">{{ produto.nome }}</p>
                  <h4 class="preco-produto">R$ {{ produto.preco.toFixed(2) }}</h4>
                  <button class="btn-adicionar" (click)="adicionarAoCarrinho(produto)">
                    Adicionar ao carrinho
                  </button>
                </article>
              }
            }
          </div>
        </section>
      }

    </div>
  </main>
</div>
